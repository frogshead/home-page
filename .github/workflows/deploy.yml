name: Deploy CV to Hetzner VM

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ env.ZOLA_VERSION }}

      - name: Install screenshot dependencies
        run: npm install
        working-directory: scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Capture project screenshots
        run: node screenshot.mjs
        working-directory: scripts

      - name: Build site
        run: zola build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Clear the web root, then copy the freshly generated static site.
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /var/www/html && rm -rf /var/www/html/*"
          scp -r public/* ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/html/

          # Fix ownership and permissions.
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "\
            sudo chown -R www-data:www-data /var/www/html && \
            sudo find /var/www/html -type d -exec chmod 755 {} \; && \
            sudo find /var/www/html -type f -exec chmod 644 {} \;"

          # Reload nginx.
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "sudo systemctl reload nginx"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
