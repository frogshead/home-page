<!DOCTYPE html>
<html lang="{% block html_lang %}fi{% endblock %}">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{% block title %}{{ config.title }}{% endblock %}</title>
	<meta name="description" content="{% block description %}{{ config.description }}{% endblock %}" />

	<!-- Fonts: Newsreader (serif), Hanken Grotesk (sans), JetBrains Mono -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap"
		rel="stylesheet" />

	<link rel="stylesheet" href="{{ get_url(path='css/style.css') }}" />
	{% if config.generate_feeds %}
	<link rel="alternate" type="application/atom+xml" title="{{ config.title }} – notes"
		href="{{ get_url(path='notes/atom.xml', trailing_slash=false) }}" />
	{% endif %}
</head>

<body class="{% block body_class %}{% endblock %}">
	{% block content %}{% endblock %}
</body>

</html>
